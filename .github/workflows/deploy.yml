name: Build site

# GitHub Pages for this repo uses "Deploy from a branch" (main, / root), so
# Pages serves whatever is committed at the repo root. This workflow rebuilds
# the site from app/ and commits the output back to main, so pushing a source
# change is enough — no local build required.
#
# Pushes made with GITHUB_TOKEN do not re-trigger workflows, so this cannot loop.

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: build-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Commit built site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets 404.html .nojekyll
          if git diff --staged --quiet; then
            echo "Build output unchanged; nothing to commit."
          else
            git commit -m "Rebuild site from source [skip ci]"
            git push
          fi
